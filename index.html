<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <div class="app-header">
    <h1>Ledger</h1>
    <span class="tagline">// personal expense tracker</span>
  </div>

  <div class="receipt">
    <div class="receipt-label">Current Balance</div>
    <div class="balance" id="balance">$0.00</div>
    <div class="receipt-split">
      <div class="split-item income">
        <span class="label"><span class="dot income"></span>Income</span>
        <span class="amount" id="totalIncome">$0.00</span>
      </div>
      <div class="split-item expense">
        <span class="label"><span class="dot expense"></span>Expenses</span>
        <span class="amount" id="totalExpense">$0.00</span>
      </div>
    </div>
  </div>

  <form class="entry-form" id="entryForm">
    <div class="form-row">
      <input type="text" id="desc" placeholder="Description (e.g. Groceries)" required>
      <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" required>
    </div>
    <div class="form-row">
      <div class="type-toggle" id="typeToggle">
        <button type="button" data-type="expense" class="active">Expense</button>
        <button type="button" data-type="income">Income</button>
      </div>
      <select id="category">
        <option>General</option>
        <option>Food</option>
        <option>Transport</option>
        <option>Rent</option>
        <option>Utilities</option>
        <option>Entertainment</option>
        <option>Salary</option>
        <option>Other</option>
      </select>
    </div>
    <div class="form-row">
      <button type="submit" class="add-btn">Add transaction</button>
    </div>
  </form>

  <div class="ledger-header">
    <h2>Transactions</h2>
    <select class="filter-select" id="filterCategory">
      <option value="all">All categories</option>
    </select>
  </div>

  <div class="ledger" id="ledger">
    <!-- transaction rows injected here -->
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
